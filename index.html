<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trading Dashboard</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeDash">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bs-body-bg: #0a0e14;
    --bs-body-color: #c9d1d9;
    --panel: #10151f;
    --panel-border: #1f2733;
    --text-dim: #6e7681;
    --text-bright: #f0f3f7;
    --green: #3fb950;
    --green-dim: #1a3a20;
    --red: #f85149;
    --red-dim: #3a1a1a;
    --amber: #d29922;
    --amber-dim: #3a2f1a;
  }
  body { font-family: 'Inter', sans-serif; padding-bottom: 40px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .card { background: var(--panel); border-color: var(--panel-border); }
  .card-header {
    background: var(--panel); border-color: var(--panel-border);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-bright);
  }
  .signal-badge {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    padding: 5px 12px; border-radius: 5px; display: inline-block; margin-bottom: 10px;
  }
  .signal-call { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .signal-put  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }
  .signal-wait { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
  .signal-unknown { background: #1a1f28; color: var(--text-dim); border: 1px solid var(--panel-border); }

  .level-row { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; display: flex; justify-content: space-between; padding: 2px 0; }
  .level-row .label { color: var(--text-dim); }

  .spread-note {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--amber);
    background: var(--amber-dim); border: 1px dashed var(--amber); border-radius: 4px;
    padding: 6px 8px; margin-top: 8px; line-height: 1.4;
  }
  .updated-line {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-border);
  }
  .combined-num { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 800; color: var(--text-bright); }
  .combined-num.pos { color: var(--green); }
  .combined-num.neg { color: var(--red); }
  .combined-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }

  #global-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }
  #install-btn { display: none; }
  .error-text { color: var(--red); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
</style>
</head>
<body class="container-fluid px-3 py-3">

<div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
  <h1 class="fs-6 mono fw-bold text-uppercase mb-0" style="letter-spacing:.08em;">
    <span style="color:var(--green)">●</span> Trading Dashboard
  </h1>
  <div class="d-flex align-items-center gap-2">
    <span id="global-time" class="mono"></span>
    <button id="install-btn" class="btn btn-sm btn-outline-success">Install App</button>
  </div>
</div>

<div id="config-note" class="alert alert-secondary mono small">
  Set your 3 deployed Web App URLs in the <code>ENDPOINTS</code> object near the top of the script below,
  then this note disappears and live data loads automatically.
</div>

<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>BTC · Swing</span>
    <span id="btc-swing-time" class="mono small text-body-secondary"></span>
  </div>
  <div class="card-body row g-3" id="btc-swing-body"></div>
</div>

<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>ETH · Swing</span>
    <span id="eth-swing-time" class="mono small text-body-secondary"></span>
  </div>
  <div class="card-body row g-3" id="eth-swing-body"></div>
</div>

<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Intraday · BTC + ETH</span>
    <span id="intraday-time" class="mono small text-body-secondary"></span>
  </div>
  <div class="card-body row g-3" id="intraday-body"></div>
  <div class="card-footer row text-center g-0" id="combined-strip"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
// SET YOUR 3 DEPLOYED WEB APP URLS HERE
// ============================================================
const ENDPOINTS = {
  btcSwing:  "PASTE_BTC_SWING_WEBAPP_URL_HERE",
  ethSwing:  "PASTE_ETH_SWING_WEBAPP_URL_HERE",
  intraday:  "PASTE_INTRADAY_WEBAPP_URL_HERE"
};
const REFRESH_MS = 60000;

function signalClass(signal) {
  if (!signal) return 'signal-unknown';
  const s = String(signal).toUpperCase();
  if (s.includes('CALL') && s.includes('CONFIRMED')) return 'signal-call';
  if (s.includes('PUT') && s.includes('CONFIRMED')) return 'signal-put';
  if (s.includes('WAIT')) return 'signal-wait';
  return 'signal-unknown';
}

function fmtNum(v) {
  if (v === '' || v === null || v === undefined) return '—';
  const n = Number(v);
  return isNaN(n) ? v : n.toLocaleString(undefined, {maximumFractionDigits: 2});
}

function assetCardHTML(d, colClass) {
  const cls = signalClass(d.finalSignal);
  const spreadHTML = d.spreadSuggestion ? `<div class="spread-note">${d.spreadSuggestion}</div>` : '';
  return `
    <div class="${colClass}">
      <div class="p-2">
        <div class="text-body-secondary mono small text-uppercase mb-1">${d.asset}</div>
        <span class="signal-badge ${cls}">${d.finalSignal || 'UNKNOWN'}</span>
        <div class="level-row"><span class="label">Entry</span><span>${fmtNum(d.entry)}</span></div>
        <div class="level-row"><span class="label">Strike</span><span>${fmtNum(d.strike)}</span></div>
        <div class="level-row"><span class="label">SL</span><span>${fmtNum(d.sl)}</span></div>
        <div class="level-row"><span class="label">TP1</span><span>${fmtNum(d.tp1)}</span></div>
        <div class="level-row"><span class="label">TP2</span><span>${fmtNum(d.tp2)}</span></div>
        ${spreadHTML}
        <div class="updated-line">Price data: ${d.lastPriceUpdate || 'unknown'}</div>
      </div>
    </div>`;
}

async function fetchJSON(url) {
  if (!url || url.startsWith('PASTE_')) return null;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    return { error: String(err) };
  }
}

async function refreshAll() {
  document.getElementById('global-time').textContent = new Date().toLocaleString();
  const anyConfigured = Object.values(ENDPOINTS).some(u => !u.startsWith('PASTE_'));
  document.getElementById('config-note').style.display = anyConfigured ? 'none' : 'block';

  const [btc, eth, intra] = await Promise.all([
    fetchJSON(ENDPOINTS.btcSwing), fetchJSON(ENDPOINTS.ethSwing), fetchJSON(ENDPOINTS.intraday)
  ]);
  renderSwing('btc-swing', btc);
  renderSwing('eth-swing', eth);
  renderIntraday(intra);
}

function renderSwing(prefix, d) {
  const body = document.getElementById(prefix + '-body');
  const timeEl = document.getElementById(prefix + '-time');
  if (!d) { body.innerHTML = ''; timeEl.textContent = 'not configured'; return; }
  if (d.error) { body.innerHTML = `<div class="col-12 error-text">${d.error}</div>`; timeEl.textContent = 'error'; return; }
  body.innerHTML = assetCardHTML(d, 'col-12');
  timeEl.textContent = d.lastPriceUpdate || '';
}

function renderIntraday(d) {
  const body = document.getElementById('intraday-body');
  const timeEl = document.getElementById('intraday-time');
  const strip = document.getElementById('combined-strip');
  if (!d) { body.innerHTML = ''; strip.innerHTML = ''; timeEl.textContent = 'not configured'; return; }
  if (d.error) { body.innerHTML = `<div class="col-12 error-text">${d.error}</div>`; strip.innerHTML = ''; timeEl.textContent = 'error'; return; }

  body.innerHTML = assetCardHTML(d.btc, 'col-6') + assetCardHTML(d.eth, 'col-6');
  timeEl.textContent = d.btc.lastPriceUpdate || '';

  const pnl = Number(d.combinedTotalPnl) || 0;
  const pnlClass = pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : '');
  strip.innerHTML = `
    <div class="col-4 py-2"><div class="combined-num ${pnlClass}">$${pnl.toFixed(2)}</div><div class="combined-label">Combined P/L</div></div>
    <div class="col-4 py-2"><div class="combined-num">${fmtNum(d.combinedTrades)}</div><div class="combined-label">Trades</div></div>
    <div class="col-4 py-2"><div class="combined-num">${d.combinedWinRate ? (Number(d.combinedWinRate)*100).toFixed(1)+'%' : '—'}</div><div class="combined-label">Win Rate</div></div>`;
}

refreshAll();
setInterval(refreshAll, REFRESH_MS);

// --- PWA: register service worker + handle install prompt ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('install-btn').style.display = 'inline-block';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});
</script>

</body>
</html>
