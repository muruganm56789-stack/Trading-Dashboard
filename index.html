<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">

<!-- iOS PWA Capabilities -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Desk">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Signal Desk</title>

<style>
  :root {
    --bg: #0B0F14; --surface: #121821; --surface-raised: #171F2A; --border: #232B35;
    --text: #E7ECF2; --muted: #6E7A8A; --muted-2: #4C5768;
    --green: #5FBF8F; --green-dim: rgba(95,191,143,0.12);
    --red: #D46A6A; --red-dim: rgba(212,106,106,0.12);
    --amber: #D4A24A; --amber-dim: rgba(212,162,74,0.12);
    --slate: #8C97A8; --swing-accent: #7C9CD4; --swing-dim: rgba(124,156,212,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(11,15,20,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(95,191,143,0.6); animation: pulse 2.4s ease-out infinite; flex-shrink: 0; }
  .pulse.stale { background: var(--muted-2); animation: none; box-shadow: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(95,191,143,0.5); } 70% { box-shadow: 0 0 0 7px rgba(95,191,143,0); } 100% { box-shadow: 0 0 0 0 rgba(95,191,143,0); } }
  h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .refreshed { margin: 4px 0 0 16px; font-size: 11px; color: var(--muted-2); }

  .tabs { display: flex; gap: 4px; margin-top: 14px; }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  .tab.swing.active { border-bottom-color: var(--swing-accent); }

  .status-strip { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; scrollbar-width: none; }
  .status-strip::-webkit-scrollbar { display: none; }
  .status-chip { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 128px; }
  .status-chip .sym { font-weight: 700; font-size: 13px; }
  .status-chip .badge { display: inline-block; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
  .badge-call { background: var(--green-dim); color: var(--green); }
  .badge-put { background: var(--red-dim); color: var(--red); }
  .badge-wait { background: var(--surface-raised); color: var(--slate); }
  .status-chip .detail { margin-top: 5px; font-size: 10.5px; color: var(--muted); line-height: 1.4; }

  main { padding: 4px 14px calc(60px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 10px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--slate); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; }
  .card.call, .card.win { border-left-color: var(--green); } 
  .card.put, .card.loss { border-left-color: var(--red); } 
  .card.flat { border-left-color: var(--amber); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .card-title { font-weight: 700; font-size: 13.5px; }
  .card-symbol { color: var(--muted); font-weight: 500; }
  .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 11px; }
  .fig-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
  .fig-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; margin-top: 2px; }
  .fig-value.up { color: var(--green); } .fig-value.down { color: var(--red); }

  .install-banner { background: var(--swing-dim); border: 1px solid var(--swing-accent); color: var(--swing-accent); font-size: 12px; font-weight: 600; text-align: center; padding: 10px; border-radius: 8px; margin: 10px 14px 0; cursor: pointer; display: none; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 46px 20px; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="pulse" id="pulseDot"></span><h1>Signal Desk</h1></div>
  <div class="refreshed mono" id="refreshedAt">connecting…</div>
  <div class="tabs">
    <div class="tab active" id="tabIntraday" onclick="switchTab('intraday')">Intraday</div>
    <div class="tab swing" id="tabSwing" onclick="switchTab('swing')">Swing</div>
  </div>
</header>

<div class="install-banner" id="installBanner" onclick="promptInstall()">📲 Install Signal Desk App</div>

<main>
  <div class="panel active" id="panelIntraday">
    <div class="status-strip" id="statusStrip"></div>
    <div class="section-label">Open Trades</div>
    <div id="openFeed"><div class="empty">Loading…</div></div>
    <div class="section-label">Alert History</div>
    <div id="historyFeed"></div>
  </div>

  <div class="panel" id="panelSwing">
    <div class="status-strip" id="statusStripSwing"></div>
    <div class="section-label">Open Trades</div>
    <div id="openFeedSwing"><div class="empty">Loading…</div></div>
    <div class="section-label">Alert History</div>
    <div id="historyFeedSwing"></div>
  </div>
</main>

<script>
  const DATA_URL = "PASTE_YOUR_WEBAPP_URL_HERE?format=json";
  const REFRESH_MS = 45000;

  function fmtNum(n, d) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString(undefined, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 2 }); }
  function fmtPct(n) { if (n == null || isNaN(n)) return '—'; const v = (n * (Math.abs(n) <= 1 ? 100 : 1)); return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }

  function switchTab(which) {
    document.getElementById('tabIntraday').classList.toggle('active', which === 'intraday');
    document.getElementById('tabSwing').classList.toggle('active', which === 'swing');
    document.getElementById('panelIntraday').classList.toggle('active', which === 'intraday');
    document.getElementById('panelSwing').classList.toggle('active', which === 'swing');
  }

  // --- Mobile PWA Service Worker & Installation Logic ---
  let deferredPrompt = null;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA SW registered successfully'))
        .catch(err => console.error('PWA SW registration failed:', err));
    });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').style.display = 'block';
  });

  function promptInstall() {
    document.getElementById('installBanner').style.display = 'none';
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User installed the PWA');
        }
        deferredPrompt = null;
      });
    }
  }
</script>
</body>
</html>
